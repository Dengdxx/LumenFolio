name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['firmware-v*', 'app-v*']

permissions:
  contents: read

jobs:
  firmware:
    if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: idf.py --preset release build
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: build/release/LumenFolio.bin
          if-no-files-found: error

  app-version:
    if: ${{ !startsWith(github.ref, 'refs/tags/firmware-v') }}
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - id: version
        shell: bash
        run: |
          version=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            version="${GITHUB_REF_NAME#app-v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo 'App version must have the form app-vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          code=$((BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] + 1))
          if (( code > 2100000000 )); then
            echo 'App version exceeds the Android versionCode limit' >&2
            exit 1
          fi
          printf 'name=%s\ncode=%s\n' "$version" "$code" >> "$GITHUB_OUTPUT"

  windows:
    needs: app-version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/pc/go.mod
          cache-dependency-path: app/pc/go.sum
      - run: |
          go test -p=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -p=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w' -o LumenFolio.exe .
        working-directory: app/pc
      - name: Build Windows installer
        env:
          APP_VERSION: ${{ needs.app-version.outputs.name }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" 'app/pc/installer/LumenFolio.iss'
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        with:
          name: app-windows
          path: app/pc/build/release/LumenFolio-Windows-x64-Setup.exe
          if-no-files-found: error

  android:
    needs: app-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/android/mobilepanel/go.mod
          cache-dependency-path: |
            app/android/mobilepanel/go.sum
            app/pc/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Go binding tools
        working-directory: app/android/mobilepanel
        run: |
          go test ./...
          GOBIN="$RUNNER_TEMP/lumenfolio-bin" go install tool
          echo "$RUNNER_TEMP/lumenfolio-bin" >> "$GITHUB_PATH"
      - name: Build ARM64 APK
        env:
          APP_VERSION: ${{ needs.app-version.outputs.name }}
          APP_VERSION_CODE: ${{ needs.app-version.outputs.code }}
        run: |
          gradle --no-daemon -p app/android :app:assembleRelease \
            "-PlumenfolioVersionName=$APP_VERSION" "-PlumenfolioVersionCode=$APP_VERSION_CODE"
      - name: Sign ARM64 release
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash app/android/tools/sign-release.sh "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: app-android
          path: LumenFolio-Android-arm64.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: app-android-unsigned
          path: app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release-firmware:
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: release
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/LumenFolio.bin \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "固件 ${GITHUB_REF_NAME#firmware-}" --notes 'ESP32-S3 Release 固件。下载 LumenFolio.bin 后可通过配套 App 或命令行执行局域网 OTA。'

  release-app:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'app-*'
          path: release
          merge-multiple: true
      - name: Publish companion app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/LumenFolio-Windows-x64-Setup.exe release/LumenFolio-Android-arm64.apk \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "配套 App ${GITHUB_REF_NAME#app-}" --notes '配套应用 Release。Windows 提供 x64 安装程序，Android 提供已签名的 ARM64 APK。'
